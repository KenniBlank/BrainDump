<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/BrainDump/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' cdn.jsdelivr.net;">
		<title>Blog</title>

		<script>
		window.MathJax = {
			tex: {
				inlineMath: [['$', '$'], ['\\(', '\\)']],
				displayMath: [['$$', '$$'], ['\\[', '\\]']],

				processEscapes: true, // Allows using \$ to write a literal dollar sign

				// Auto-number equations if use \begin{equation} or \begin{align}
				tags: 'ams',
			},
			options: {
				ignoreHtmlClass: 'tex2jax_ignore'
			},
			svg: { fontCache: 'global' }
		};
		</script>
		<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" crossorigin="anonymous"></script>
		<script type="module" crossorigin src="/BrainDump/assets/index-DlnHd_kO.js"></script>
		<link rel="stylesheet" crossorigin href="/BrainDump/assets/index-Dz0BPrzH.css">
	</head>
	<body>
		<header class="site-header">
			<h1><a href="/BrainDump/">Brain Dump</a></h1>
		</header>

		<main class="layout">
			<aside class="sidebar">
				<h2>POSTS LIST</h2>
				<label class="search-box">
					<input id="post-search" placeholder="⌕ Search posts..." autocomplete="off" type="search" />
				</label>
				<nav id="tree"></nav>
			</aside>

			<div id="resizer" class="resizer"></div>

			<button id="sidebar-hide_show" class="sidebar-toggle" aria-label="Toggle sidebar"></button>
			<article class="content" id="content">
				<h2>Welcome</h2>
				<p>Select a post to read.</p>
			</article>
		</main>

		<button id="back-to-top" class="back-to-top" aria-label="Scroll to top">&#9650;</button>

		<script>
		const layout = document.querySelector('.layout');
		const toggleBtn = document.getElementById('sidebar-hide_show');
		const MOBILE = 768;
		let isMobile = window.innerWidth <= MOBILE;

		const toggleBtnTxt = () => {
			const isCollapsed = layout.classList.contains('sidebar-collapsed');
			const arrow = isMobile
				? (isCollapsed ? '&#9650;' : '&#9660;')		// ▼ down = open, ▲ up = close
				: (isCollapsed ? '&gt;&gt;' : '&lt;&lt;');	// << >> for desktop
			toggleBtn.innerHTML = arrow;
		}

		toggleBtn.addEventListener('click', () => {
			layout.classList.toggle('sidebar-collapsed');
			toggleBtnTxt();
		});

		window.addEventListener('resize', () => {
			const nowMobile = window.innerWidth <= MOBILE;
			if (nowMobile !== isMobile) {
				isMobile = nowMobile;
				toggleBtnTxt();
			}
		});

		window.addEventListener('load', toggleBtnTxt);
		window.addEventListener('load', () => {
			// Check for a saved width and apply it
			const savedWidth = localStorage.getItem('customSidebarWidth');
			if (savedWidth) {
				layout.style.setProperty('--user-width', `${savedWidth}px`);
			}
		});

		// ===========================================================================
		// ---------------------------Resize Sidebar:---------------------------------
		// ===========================================================================
		const resizer = document.getElementById('resizer');
		let isResizingState = false;

		resizer.addEventListener('mousedown', (e) => {
			isResizingState = true;
			layout.classList.add('is-resizing'); // Disables CSS transition during drag
			document.body.style.cursor = 'col-resize';
			document.body.style.userSelect = 'none';
		});

		document.addEventListener('mousemove', (e) => {
			if (!isResizingState) return;

			let newWidth = e.clientX;

			// Set min and max limits for the sidebar
			if (newWidth < 200) newWidth = 200;
			if (newWidth > 600) newWidth = 600;

			layout.style.setProperty('--user-width', `${newWidth}px`);
		});

		document.addEventListener('mouseup', () => {
			if (isResizingState) {
				isResizingState = false;
				layout.classList.remove('is-resizing');
				document.body.style.cursor = 'default';
				document.body.style.userSelect = 'auto';

				// Get the final computed width and save it to localStorage
				const finalWidth = getComputedStyle(layout).getPropertyValue('--sidebar-width');
				localStorage.setItem('customSidebarWidth', parseInt(finalWidth));
			}
		});

		// ================================================
		// ..................Scroll to Top.................
		// ================================================
		const backToTopBtn = document.getElementById('back-to-top');

		// Show button only after scrolling down 300px
		window.addEventListener('scroll', () => {
			if (window.scrollY > 300) {
				backToTopBtn.classList.add('visible');
			} else {
				backToTopBtn.classList.remove('visible');
			}
		});
		// Scroll to the top on click
		backToTopBtn.addEventListener('click', () => {
			window.scrollTo({
				top: 0,
				behavior: 'smooth'
			});
		});

		// ================================================
		// ..................Search Feature................
		// ================================================
		const search = document.getElementById("post-search");

		search.addEventListener("input", () => {
			const query = search.value.trim().toLowerCase();

			document.querySelectorAll("#tree a").forEach((link) => {
				const item = link.closest("li");
				if (!item) return;
				item.hidden = query !== "" && !link.textContent.toLowerCase().includes(query);
			});
		});

		isModifierDown = false
		document.addEventListener("keydown", (e) => {
			if (e.key === "/" && document.activeElement !== search && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
				e.preventDefault();
				search.focus();
			}

			if (e.key === "Enter" && document.activeElement === search) {
				e.preventDefault();
				const firstVisibleLink = Array.from(document.querySelectorAll("#tree a")).find((link) => {
					const item = link.closest("li");
					return item && !item.hidden;
				});

				if (firstVisibleLink) {
					firstVisibleLink.click();
				}
			}

			if (e.key === "Escape" && document.activeElement === search) {
				e.preventDefault();
				search.blur();
			}

			if (e.key === "Alt") {
				isModifierDown = true;
			}

			if (isModifierDown && e.key === "a") {
				toggleBtn.click();
			}
		});

		document.addEventListener("keyup", (e) => {
			if (e.key === "Alt") {
				isModifierDown = false;
			}
		});

		</script>

	</body>
</html>
